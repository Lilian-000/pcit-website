name: Fetch Petition Count

on:
  schedule:
    - cron: '0 * * * *'   # 每小時執行一次
  workflow_dispatch:        # 允許手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch count from join.gov.tw
        run: |
          # 下載頁面
          curl -s --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://join.gov.tw/idea/detail/ba071237-01f4-40c4-a322-b1c0b16111dd" \
            -o /tmp/page.html

          # 用 Python 解析（資料以 \"field\":value 格式嵌在 JS 中）
          python3 << 'PYEOF'
          import re, json, datetime, sys

          with open('/tmp/page.html', encoding='utf-8', errors='ignore') as f:
              html = f.read()

          # 取附議數
          m = re.search(r'\\"endorseCount\\":\s*(\d+)', html)
          if not m:
              # 備用：無轉義格式
              m = re.search(r'"endorseCount"\s*:\s*(\d+)', html)

          if not m:
              print("ERROR: cannot find endorseCount", file=sys.stderr)
              # 保留現有值
              with open('data/count.json') as f:
                  existing = json.load(f)
              count = existing['count']
          else:
              count = int(m.group(1))

          # 取截止日期 (approvedDueDate，毫秒時間戳)
          d = re.search(r'\\"approvedDueDate\\":\s*(\d+)', html)
          if not d:
              d = re.search(r'"approvedDueDate"\s*:\s*(\d+)', html)

          today = datetime.date.today()
          if d:
              due_ts  = int(d.group(1)) / 1000
              due_date = datetime.datetime.utcfromtimestamp(due_ts).date()
              days_left = max(0, (due_date - today).days)
          else:
              # 保留現有值
              with open('data/count.json') as f:
                  days_left = json.load(f).get('days_left', 0)

          data = {
              'count':     count,
              'updated':   str(today),
              'days_left': days_left
          }
          with open('data/count.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"count={count}  days_left={days_left}  date={today}")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/count.json
          if git diff --cached --quiet; then
            echo "No change, skipping commit."
          else
            git commit -m "chore: update petition count [skip ci]"
            git push
          fi
