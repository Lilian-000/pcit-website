name: Fetch Petition Count

on:
  schedule:
    - cron: '0 * * * *'   # 每小時執行一次
  workflow_dispatch:        # 允許手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch count from join.gov.tw
        run: |
          # 爬取附議頁面
          PAGE=$(curl -s --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://join.gov.tw/idea/detail/ba071237-01f4-40c4-a322-b1c0b16111dd")

          # 取得附議數（HTML 中 agreeCount 或類似欄位）
          COUNT=$(echo "$PAGE" | grep -oP '"agreeCount"\s*:\s*\K[0-9]+' | head -1)

          # 若 JSON 欄位找不到，嘗試從頁面文字取數字
          if [ -z "$COUNT" ]; then
            COUNT=$(echo "$PAGE" | grep -oP '(?<=附議人數[：:]\s{0,5})[0-9,]+' | tr -d ',' | head -1)
          fi

          # 備用：直接呼叫 join.gov.tw API
          if [ -z "$COUNT" ]; then
            API=$(curl -s --max-time 30 \
              -H "Accept: application/json" \
              "https://join.gov.tw/idea/detail/ba071237-01f4-40c4-a322-b1c0b16111dd")
            COUNT=$(echo "$API" | python3 -c "
          import sys, json, re
          raw = sys.stdin.read()
          # try JSON parse
          try:
              d = json.loads(raw)
              for key in ('agreeCount','agree_count','count','signCount'):
                  if key in d:
                      print(d[key]); exit()
              # nested
              for v in d.values():
                  if isinstance(v, dict):
                      for key in ('agreeCount','agree_count','count','signCount'):
                          if key in v:
                              print(v[key]); exit()
          except Exception:
              pass
          # fallback regex
          m = re.search(r'['\''\"](agreeCount|agree_count|signCount)['\''\"]\s*:\s*['\''\"]*(\d+)', raw)
          if m:
              print(m.group(2))
          " 2>/dev/null)
          fi

          # 計算剩餘天數（附議截止日 2026-07-09）
          DEADLINE="2026-07-09"
          TODAY=$(date -u +%Y-%m-%d)
          DAYS_LEFT=$(( ( $(date -d "$DEADLINE" +%s) - $(date -d "$TODAY" +%s) ) / 86400 ))
          if [ "$DAYS_LEFT" -lt 0 ]; then DAYS_LEFT=0; fi

          # 若還是取不到，保留舊值
          if [ -z "$COUNT" ] || ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            COUNT=$(python3 -c "import json; d=json.load(open('data/count.json')); print(d['count'])")
          fi

          echo "COUNT=$COUNT  DAYS_LEFT=$DAYS_LEFT  DATE=$TODAY"

          # 寫入 data/count.json
          python3 -c "
          import json, datetime
          data = {'count': int('$COUNT'), 'updated': '$TODAY', 'days_left': int('$DAYS_LEFT')}
          with open('data/count.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False)
          print(json.dumps(data))
          "

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/count.json
          if git diff --cached --quiet; then
            echo "No change, skipping commit."
          else
            git commit -m "chore: update petition count [skip ci]"
            git push
          fi
