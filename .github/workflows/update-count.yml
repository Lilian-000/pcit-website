name: Update Petition Count

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 = 台灣時間 08:00
  workflow_dispatch:        # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch signatures and visitors
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          node - << 'JSEOF'
          const https = require('https');
          const fs    = require('fs');

          // ── 工具：HTTPS GET（自動跟隨轉址）──────────────────────
          function get(url, reqOptions = {}, redirects = 5) {
            return new Promise((resolve, reject) => {
              const parsed = new URL(url);
              const opts = {
                hostname: parsed.hostname,
                path: parsed.pathname + parsed.search,
                headers: reqOptions.headers || {},
              };
              https.get(opts, (res) => {
                if ([301, 302, 303, 307, 308].includes(res.statusCode) &&
                    res.headers.location && redirects > 0) {
                  return get(res.headers.location, reqOptions, redirects - 1)
                    .then(resolve).catch(reject);
                }
                let body = '';
                res.setEncoding('utf8');
                res.on('data', chunk => body += chunk);
                res.on('end', () => resolve({ status: res.statusCode, body }));
              }).on('error', reject);
            });
          }

          // ── 讀取現有 count.json（作為失敗時的備用值）────────────
          let existing = { signatures: 0, visitors: 0 };
          try {
            existing = JSON.parse(fs.readFileSync('data/count.json', 'utf8'));
          } catch (_) {}

          (async () => {
            // ── ① 抓附議數（join.gov.tw）─────────────────────────
            let signatures = existing.signatures || existing.count || 0;
            try {
              const JOIN_URL = 'https://join.gov.tw/idea/detail/ba071237-01f4-40c4-a322-b1c0b16111dd';
              const { status, body } = await get(JOIN_URL, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml',
                  'Accept-Language': 'zh-TW,zh;q=0.9',
                },
              });
              console.log(`join.gov.tw HTTP ${status}, length: ${body.length}`);
              let match = body.match(/\\"endorseCount\\":\s*(\d+)/);
              if (!match) match = body.match(/"endorseCount"\s*:\s*(\d+)/);
              if (match) {
                signatures = parseInt(match[1], 10);
                console.log(`signatures: ${signatures}`);
              } else {
                console.warn('WARNING: endorseCount not found, keeping existing:', signatures);
              }
            } catch (err) {
              console.warn('WARNING: join.gov.tw fetch failed:', err.message);
            }

            // ── ② 抓瀏覽人次（GoatCounter API）──────────────────
            // 失敗時保留既有值（不蓋掉），既有值不存在才退回 0
            let visitors = (existing.visitors > 0) ? existing.visitors : 0;
            const token = process.env.GOATCOUNTER_TOKEN;
            if (token) {
              try {
                const GC_URL = 'https://pcit-tw.goatcounter.com/api/v0/stats/total';
                const { status, body } = await get(GC_URL, {
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                  },
                });
                console.log(`GoatCounter HTTP ${status}, body: ${body.slice(0, 300)}`);
                if (status === 200) {
                  const data = JSON.parse(body);
                  // 嘗試各種可能的欄位名稱；完整 log 方便偵錯
                  console.log('GoatCounter response keys:', Object.keys(data).join(', '));
                  const raw = data.total ?? data.total_hits ?? data.count ?? data.hits ?? null;
                  if (raw !== null) {
                    const parsed = typeof raw === 'string'
                      ? parseInt(raw.replace(/,/g, ''), 10)
                      : parseInt(raw, 10);
                    if (parsed > 0) {
                      visitors = parsed;
                      console.log(`visitors: ${visitors}`);
                    } else {
                      console.warn('WARNING: GoatCounter parsed to 0 or NaN, keeping existing:', visitors);
                    }
                  } else {
                    console.warn('WARNING: no known field found. Full response:', JSON.stringify(data).slice(0, 500));
                  }
                } else {
                  console.warn(`WARNING: GoatCounter returned ${status}, keeping existing visitors: ${visitors}`);
                }
              } catch (err) {
                console.warn('WARNING: GoatCounter fetch failed:', err.message, '— keeping existing visitors:', visitors);
              }
            } else {
              console.warn('WARNING: GOATCOUNTER_TOKEN not set — keeping existing visitors:', visitors);
            }

            // ── ③ 寫入 data/count.json ────────────────────────────
            const output = {
              signatures,
              visitors,
              updated_at: new Date().toISOString(),
            };
            fs.writeFileSync('data/count.json', JSON.stringify(output, null, 2) + '\n', 'utf8');
            console.log('Wrote data/count.json:', JSON.stringify(output));
          })();
          JSEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/count.json
          if git diff --cached --quiet; then
            echo "No change, skipping commit."
          else
            # 不加 [skip ci]：必須讓 Cloudflare Pages 重新部署，網站才會拿到新數字
            git commit -m "chore: update petition count and visitors"
            git push
          fi
